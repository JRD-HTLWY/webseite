<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --ink:#12151c; --muted:#5d6472; --accent:#2f5bff; --on-accent:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1218; --ink:#eef1f7; --muted:#9aa3b5; --accent:#6f8dff; --on-accent:#0b0f1a}
}
:root[data-theme="dark"]{--bg:#0f1218; --ink:#eef1f7; --muted:#9aa3b5; --accent:#6f8dff; --on-accent:#0b0f1a}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink); overflow-x:hidden;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5;
}
main{
  position:relative; max-width:720px; min-height:100vh; margin:0 auto;
  padding:clamp(1.25rem,5vw,3rem); display:flex; flex-direction:column; justify-content:center; gap:1.25rem;
}
.mark{
  position:absolute; right:0; top:8%; font-size:clamp(12rem,38vw,24rem); font-weight:800; line-height:1;
  color:var(--accent); opacity:.13; pointer-events:none; user-select:none;
}
h1{
  position:relative; margin:0; font-size:clamp(2.75rem,9vw,5.5rem); font-weight:800;
  line-height:.98; letter-spacing:-.035em; font-variation-settings:"opsz" 96;
}
p{position:relative; margin:0; max-width:36ch; font-size:1.125rem; color:var(--muted)}
.btn{
  position:relative; align-self:flex-start; margin-top:.75rem; font:inherit; font-weight:800; font-size:1.1rem;
  background:var(--accent); color:var(--on-accent); border:0; border-radius:12px; padding:1rem 2rem; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">?</div>
  <h1 id="title"></h1>
  <p id="desc"></p>
  <button class="btn" id="start" type="button"></button>
</main>

<script>
// Hier anpassen
const QUIZ = {
  title:  "Wie gut kennst du dich aus?",
  desc:   "Teste dein Wissen. Kein Zeitlimit.",
  button: "Quiz starten",
  onStart() { location.href = "quiz.html"; }   // oder eigene Funktion
};

document.title = QUIZ.title;
title.textContent = QUIZ.title;
desc.textContent = QUIZ.desc;
start.textContent = QUIZ.button;
start.addEventListener("click", QUIZ.onStart);
</script>
</body>
</html>
